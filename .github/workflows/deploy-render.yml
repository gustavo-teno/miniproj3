# Deploy do backend no Render a cada merge na main (#14, Pessoa C).
#
# O serviço do Render foi criado pela aba "Public Git Repository" (o repositório
# é do Gustavo, e o Render não tinha acesso a ele). Por esse caminho o Render
# não recebe aviso do GitHub quando entra um commit, então o "Auto-Deploy: On
# Commit" fica marcado mas não dispara, e o site da Vercel andava na frente da
# API. Este fluxo chama o Deploy Hook do Render (Settings → Deploy Hook), que
# faz o deploy do último commit da branch configurada lá (a main).
#
# O link do hook é secreto: fica no segredo RENDER_DEPLOY_HOOK do repositório
# (Settings → Secrets and variables → Actions), nunca no código.

name: Deploy do backend no Render

on:
  push:
    branches: [main]
    # Só quando o backend muda: o front vai pela Vercel, que já acompanha a main.
    paths:
      - "backend/**"
      - ".github/workflows/deploy-render.yml"
  # Botão "Run workflow" na aba Actions, para um deploy na mão.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pede ao Render o deploy do último commit
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "Falta o segredo RENDER_DEPLOY_HOOK no repositório (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          curl --fail --silent --show-error -X POST "$HOOK"
          echo "Deploy pedido ao Render."
